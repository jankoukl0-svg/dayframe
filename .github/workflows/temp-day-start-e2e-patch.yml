name: Apply day start E2E patch

on:
  push:
    branches:
      - fix/day-start-8am

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day-start-8am
          fetch-depth: 0
      - name: Apply E2E patch
        run: python .github/patch-day-start-e2e.py
      - name: Commit E2E patch if needed
        shell: bash
        run: |
          if git diff --quiet -- web/e2e/dayframe-calendar.spec.mjs; then
            echo "E2E patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/dayframe-calendar.spec.mjs
          git commit -m "Update 08:00 timeline regression coverage"
          git push origin HEAD:fix/day-start-8am
