name: Apply add task escape fix

on:
  push:
    branches:
      - feature/add-task-modal

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/add-task-modal
          fetch-depth: 0
      - name: Apply fix
        run: python3 .tmp/fix_add_task_escape.py
      - name: Remove helpers
        run: |
          rm -f .tmp/fix_add_task_escape.py
          rm -f .github/workflows/apply-add-task-escape-fix.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/dayframe-v2.tsx .tmp/fix_add_task_escape.py .github/workflows/apply-add-task-escape-fix.yml
          git commit -m "Make Escape close the add-task modal from form fields"
          git push origin HEAD:feature/add-task-modal
