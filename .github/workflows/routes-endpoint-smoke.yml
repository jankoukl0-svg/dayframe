name: Routes endpoint GET smoke
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production and preview APIs (GET only — no Google billing)
        shell: bash
        run: |
          set -euo pipefail
          for host in dayframe2.vercel.app dayframe2-git-fix-google-routes-visible-status-honzakoukl1-2501.vercel.app; do
            echo "Checking ${host}..."
            success=no
            for attempt in $(seq 1 15); do
              code=$(curl --connect-timeout 8 --max-time 15 -sS -L -o /tmp/route-response.txt -w "%{http_code}" "https://${host}/api/google-travel")
              echo "Host ${host}: HTTP ${code} (attempt ${attempt})"
              if [ "$code" = 200 ]; then
                python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("/tmp/route-response.txt").read_text())
          print("Availability",payload.get("available"),"Budget configured",payload.get("budgetConfigured"))
          assert "available" in payload and "dailyLimit" in payload
          PY
                success=yes
                break
              fi
              if [ "${host}" = "dayframe2.vercel.app" ]; then break; fi
              sleep 5
            done
            if [ "${host}" != "dayframe2.vercel.app" ]; then test "$success" = yes; fi
          done
