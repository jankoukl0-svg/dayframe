name: Check and publish web preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"

permissions:
  contents: read

concurrency:
  group: dayframe-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run planning and fragrance regressions
        run: node --experimental-strip-types --test lib/dayframe-calendar.test.mjs lib/dayframe-countdown.test.mjs lib/dayframe-planning.test.mjs lib/dayframe-smart-input.test.mjs lib/dayframe-fragrance.test.mjs

      - name: Build static preview
        run: pnpm preview:build

      - name: Select targeted browser tests
        id: targeted
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          TESTS="$(node scripts/select-e2e-tests.mjs "$BASE_SHA" "${{ github.sha }}")"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "Targeted E2E: $TESTS"

      - name: Run targeted browser tests first
        env:
          DAYFRAME_E2E_TIMEOUT: 300
        run: bash scripts/run-static-e2e.sh ${{ steps.targeted.outputs.tests }}

      - name: Upload targeted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-e2e-failure-${{ github.sha }}
          path: |
            /tmp/dayframe-e2e/test-results
            /tmp/dayframe-preview.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload preview for parallel regression
        uses: actions/upload-artifact@v4
        with:
          name: dayframe-preview-${{ github.sha }}
          path: web/preview-dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/preview-dist

  full-e2e:
    name: full-e2e (${{ matrix.shard }})
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "1/4"
          - "2/4"
          - "3/4"
          - "4/4"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified preview
        uses: actions/download-artifact@v4
        with:
          name: dayframe-preview-${{ github.sha }}
          path: web/preview-dist

      - name: Run regression shard
        env:
          DAYFRAME_E2E_TIMEOUT: 420
        run: bash scripts/run-static-e2e.sh --shard=${{ matrix.shard }}

      - name: Upload shard failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            /tmp/dayframe-e2e/test-results
            /tmp/dayframe-preview.log
          if-no-files-found: ignore
          retention-days: 3

  regression-gate:
    name: full regression gate
    needs: full-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E shard to pass
        run: test "${{ needs.full-e2e.result }}" = "success"

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - build-preview
      - regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
