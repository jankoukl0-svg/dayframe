name: Check and publish web preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"

permissions:
  contents: read

concurrency:
  group: dayframe-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run planning regression tests
        run: node --experimental-strip-types --test lib/dayframe-calendar.test.mjs lib/dayframe-countdown.test.mjs lib/dayframe-planning.test.mjs lib/dayframe-smart-input.test.mjs

      - name: Build static preview
        run: pnpm preview:build

      - name: Install isolated Playwright runtime
        run: |
          rm -rf /tmp/dayframe-e2e
          mkdir -p /tmp/dayframe-e2e
          cp e2e/*.spec.mjs /tmp/dayframe-e2e/
          cd /tmp/dayframe-e2e
          npm init -y >/dev/null
          timeout 180s npm install --no-package-lock --ignore-scripts @playwright/test@1.55.0
          google-chrome --version
          cat > playwright.config.mjs <<'EOF'
          export default {
            use: { channel: "chrome" },
          };
          EOF

      - name: Test built preview at the GitHub Pages subpath
        env:
          DAYFRAME_BASE_URL: http://127.0.0.1:4173/dayframe/
        run: |
          mkdir -p /tmp/dayframe-static/dayframe
          cp -a preview-dist/. /tmp/dayframe-static/dayframe/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/dayframe-static > /tmp/dayframe-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS "$DAYFRAME_BASE_URL" >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/dayframe-preview.log
            exit 1
          fi
          cd /tmp/dayframe-e2e
          timeout 600s npx playwright test --config=playwright.config.mjs --workers=1 --reporter=line

      - name: Upload verified Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/preview-dist

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v4
