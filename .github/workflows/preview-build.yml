name: Check web preview

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/preview-build.yml"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run planning regression tests
        run: node --experimental-strip-types --test lib/dayframe-*.test.mjs

      - name: Build static preview
        run: pnpm preview:build

      - name: Install isolated Playwright runtime
        run: |
          rm -rf /tmp/dayframe-e2e
          mkdir -p /tmp/dayframe-e2e
          cp e2e/dayframe-calendar.spec.mjs /tmp/dayframe-e2e/dayframe-calendar.spec.mjs
          cd /tmp/dayframe-e2e
          npm init -y >/dev/null
          npm install --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium --with-deps

      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory preview-dist > /tmp/dayframe-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/dayframe-preview.log
            exit 1
          fi
          cd /tmp/dayframe-e2e
          npx playwright test dayframe-calendar.spec.mjs --workers=1 --reporter=line
