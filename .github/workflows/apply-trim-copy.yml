name: Apply copy trim

on:
  push:
    branches:
      - ux/trim-copy-2026-09-19

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/trim-copy-2026-09-19
      - name: Trim nonessential copy
        run: python scripts/trim_copy_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/dayframe-v2.tsx web/app/dayframe-v2.css
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Trim nonessential interface copy"
          git push origin HEAD:ux/trim-copy-2026-09-19
