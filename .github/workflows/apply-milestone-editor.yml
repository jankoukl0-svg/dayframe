name: Apply milestone editor patch

on:
  push:
    branches:
      - feature/edit-milestones-2026-09-17

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/edit-milestones-2026-09-17
      - name: Apply milestone editing
        run: python scripts/apply_milestone_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/dayframe-v2.tsx web/app/dayframe-v2.css web/e2e/dayframe-calendar.spec.mjs
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Add milestone editing"
          git push origin HEAD:feature/edit-milestones-2026-09-17
