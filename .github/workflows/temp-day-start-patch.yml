name: Apply day start patch

on:
  push:
    branches:
      - fix/day-start-8am

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day-start-8am
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/patch-day-start.py

      - name: Commit source patch if needed
        shell: bash
        run: |
          if git diff --quiet -- web/lib/dayframe-calendar.ts web/app/dayframe-v2.tsx web/lib/dayframe-calendar.test.mjs; then
            echo "Source patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/dayframe-calendar.ts web/app/dayframe-v2.tsx web/lib/dayframe-calendar.test.mjs
          git commit -m "Apply 08:00 day start patch"
          git push origin HEAD:fix/day-start-8am
