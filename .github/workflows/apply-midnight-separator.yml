name: Apply midnight separator styling

on:
  push:
    branches:
      - ui/midnight-visual-separator
    paths:
      - .github/scripts/apply-midnight-separator.py
      - .github/workflows/apply-midnight-separator.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/midnight-visual-separator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CSS patch
        run: python .github/scripts/apply-midnight-separator.py
      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/apply-midnight-separator.py
          rm .github/workflows/apply-midnight-separator.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/dayframe-v2.css .github/scripts/apply-midnight-separator.py .github/workflows/apply-midnight-separator.yml
          git commit -m "Add graphical midnight separator"
          git push origin HEAD:ui/midnight-visual-separator
