name: Apply Google Calendar edge-case fixes

on:
  push:
    branches:
      - feat/google-calendar-readonly

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-calendar-readonly
          fetch-depth: 0
      - name: Apply source fixes
        run: python .github/patch-google-calendar-edge.py
      - name: Commit fixes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/google-calendar-controller.tsx
          git commit -m "Handle Google Calendar OAuth and range edge cases"
          git rm .github/patch-google-calendar-edge.py .github/workflows/temp-google-calendar-edge-fixes.yml
          git commit -m "Remove temporary Google Calendar edge-case patch"
          git push origin HEAD:feat/google-calendar-readonly
