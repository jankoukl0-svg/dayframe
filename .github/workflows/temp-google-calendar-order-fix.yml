name: Apply Google Calendar control order fix

on:
  push:
    branches:
      - feat/google-calendar-readonly

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-calendar-readonly
          fetch-depth: 0
      - name: Preserve native control order
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/app/google-calendar-controller.tsx')
          text = path.read_text()
          old = '    container.insertBefore(host, container.firstChild);'
          new = '    container.appendChild(host);'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Google control insertion target not found')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/google-calendar-controller.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Preserve native calendar control order"
          fi
          git rm .github/workflows/temp-google-calendar-order-fix.yml
          git commit -m "Remove temporary Google Calendar patch workflow"
          git push origin HEAD:feat/google-calendar-readonly
