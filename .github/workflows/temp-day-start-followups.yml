name: Apply 08:00 follow-up patch

on:
  push:
    branches:
      - fix/day-start-8am

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day-start-8am
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/patch-day-start-followups.py
      - name: Commit source patch if needed
        shell: bash
        run: |
          if git diff --quiet -- web/app/activity-time-controller.tsx web/app/dayframe-v2.tsx web/app/late-reading-controller.css web/e2e/dayframe-calendar.spec.mjs web/e2e/week-capacity.spec.mjs web/e2e/week-reading-23.spec.mjs web/e2e/activity-time-adjustments.spec.mjs; then
            echo "Follow-up patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/activity-time-controller.tsx web/app/dayframe-v2.tsx web/app/late-reading-controller.css web/e2e/dayframe-calendar.spec.mjs web/e2e/week-capacity.spec.mjs web/e2e/week-reading-23.spec.mjs web/e2e/activity-time-adjustments.spec.mjs
          git commit -m "Finish 08:00 timeline integration"
          git push origin HEAD:fix/day-start-8am
