name: Apply sidebar cleanup

on:
  push:
    branches:
      - fix/remove-add-task-sidebar

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-add-task-sidebar
      - name: Remove add-task sidebar item and update test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('web/app/dayframe-v2.tsx')
          text = app.read_text()
          needle = '            <NavButton active={false} onClick={() => openAdd()} label="Přidat úkol" shortcut="2" />\n'
          if needle not in text:
              raise SystemExit('sidebar add-task nav item not found')
          app.write_text(text.replace(needle, '', 1))
          test = Path('web/e2e/add-task-modal.spec.mjs')
          text = test.read_text()
          text = text.replace('test("sidebar and shortcut 2 open the modal while preserving the active week", async ({ page }) => {', 'test("shortcut 2 opens the modal while preserving the active week", async ({ page }) => {', 1)
          text = text.replace('  const addNav = page.locator(".df2-sidebar nav button").filter({ hasText: "Přidat úkol" });\n', '  await expect(page.locator(".df2-sidebar nav button").filter({ hasText: "Přidat úkol" })).toHaveCount(0);\n', 1)
          text = text.replace('  await addNav.click();\n', '  await page.keyboard.press("2");\n', 1)
          text = text.replace('  await expect(addNav).not.toHaveClass(/active/);\n', '', 1)
          test.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/app/dayframe-v2.tsx web/e2e/add-task-modal.spec.mjs
          git commit -m "Remove add task from sidebar"
          git push origin HEAD:fix/remove-add-task-sidebar
