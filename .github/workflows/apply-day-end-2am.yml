name: Apply 2am planning day patch

on:
  push:
    branches:
      - feature/day-end-2am

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/day-end-2am
      - name: Apply planning-day changes
        run: python3 scripts/apply-day-end-2am.py
      - name: Commit clean result
        run: |
          rm scripts/apply-day-end-2am.py .github/workflows/apply-day-end-2am.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extend planning day to 2am"
          git push origin HEAD:feature/day-end-2am
